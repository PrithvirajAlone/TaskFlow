<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Task | taskFlow</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>
    <svg class="cyber-cursor" viewBox="0 0 64 80">
        <path d="M3 2 L25 28 L37 12 L34 35 L61 43 L36 49 L49 76 L29 56 L12 75 L19 48 L3 2 Z" fill="#00ff66"
            stroke="#d7ffe3" stroke-width="2" stroke-linejoin="miter" />
    </svg>
    <div class="edit-container">
        <h1>Edit Task</h1>

        <form action="/update" method="post">
            <input type="hidden" name="task_id" value="{{ task.id }}">
            <input type="text" name="title" value="{{ task.title }}" required>
            <button type="submit">Save Changes</button>
        </form>
        <a href="/">Cancel</a>
    </div>
    <script>
        const cursor = document.querySelector('.cyber-cursor');

        document.addEventListener('mousemove', function (e) {
            cursor.style.left = e.clientX + 'px';
            cursor.style.top = e.clientY + 'px';
        });
    </script>
</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Statistics | TaskFlow</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>
    <svg class="cyber-cursor" viewBox="0 0 64 80">
        <path d="M3 2 L25 28 L37 12 L34 35 L61 43 L36 49 L49 76 L29 56 L12 75 L19 48 L3 2 Z" fill="#00ff66"
            stroke="#d7ffe3" stroke-width="2" stroke-linejoin="miter" />
    </svg>

    <h1>TaskFlow Statistics</h1>
    <div class="stats-container">

        <div class="stat-card">
            <h2>Total Tasks</h2>
            <p>{{ total_tasks }}</p>
        </div>

    </div>
    <p>Total Tasks: {{ total_tasks }}</p>
    <p>Completed Tasks: {{ completed_tasks }}</p>
    <p>Pending Tasks: {{ pending_tasks }}</p>
    <p>Completion: {{ "%.1f"|format(progress) }}%</p>
    <div class="progress-container">
        <div class="progress-bar" style="width: {{ progress }}%;"></div>
    </div>
    <script>
        const cursor = document.querySelector('.cyber-cursor');

        document.addEventListener('mousemove', function (e) {
            cursor.style.left = e.clientX + 'px';
            cursor.style.top = e.clientY + 'px';
        });
    </script>
</body>

</html>
